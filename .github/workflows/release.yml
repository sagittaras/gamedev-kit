name: Release

# Release is triggered manually from main ("Run workflow"). Every package is versioned on its own
# by Nerdbank.GitVersioning — major.minor lives in the package's version.json, the patch is the
# number of commits touching the package (or its kit dependencies, see pathFilters). A package gets
# its own draft release only when its computed version has no tag yet; unchanged packages are skipped.
# The Unity package pre-images must match the versions being released — the Unity Packages workflow
# checks that on every pull request, and this workflow refuses to draft anything when they don't.
on:
  workflow_dispatch:

jobs:
  make-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # nbgv computes the version from the git height, which needs the full history.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install nbgv
        run: dotnet tool install --global nbgv --version 3.10.94

      - name: Restore, Build & Test
        working-directory: srcs/csharp
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build

      - name: Install Unity UPM CLI
        run: bash .github/scripts/install-upm-cli.sh

      # One draft per package due for release, with its zip archive and — for a Unity package — its signed
      # Unity package, which OpenUPM publishes once the draft is published. Every Unity package due for
      # release must pass the gate first; otherwise nothing is drafted (see release-drafts.sh).
      - name: Draft Releases
        env:
          GH_TOKEN: ${{ github.token }}
          UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
        run: bash .github/scripts/release-drafts.sh artifacts
