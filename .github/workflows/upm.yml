name: OpenUPM

# Publishes the Unity package pre-images for OpenUPM, which builds packages from git tags. Every package with
# a Unity skeleton (srcs/unity/Packages/com.sagittaras.gamedevkit.<slug>) gets an orphan branch upm/<slug> holding
# just the package, tagged upm/<slug>/<version>; OpenUPM watches those tags (gitTagPrefix "upm/<slug>/").
#
# The workflow is a sync — see .github/scripts/upm-sync.sh. On a published release it runs at the release's
# commit. Run it manually from main to catch up a version released with a stale pre-image: refreshing Plugins/
# afterwards keeps the version, so no new release comes, but the sync publishes the now verified pre-image.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: upm
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (github.event_name == 'release' && github.event.release.tag_name != 'latest') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # nbgv computes the version from the git height, which needs the full history (and the tags).
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install nbgv
        run: dotnet tool install --global nbgv --version 3.10.94

      - name: Sync OpenUPM Packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/upm-sync.sh
