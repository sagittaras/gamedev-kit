name: OpenUPM

# OpenUPM publishes the signed Unity packages unchanged from GitHub Release assets (trackingMode: githubRelease):
# it finds a version by its <slug>/<version> tag and takes the com.sagittaras.gamedevkit.<slug>-<version>.tgz asset
# of that release. release.yml signs and attaches the tarball itself whenever the pre-image passes the gate.
#
# This workflow is the catch-up — see .github/scripts/upm-sync.sh. When a release is drafted with a stale pre-image,
# refresh the pre-image on main (committing Plugins/ keeps the version), run this workflow, and publish the draft
# afterwards: OpenUPM waits for the asset of an already published release only for 3 days.
on:
  workflow_dispatch:

concurrency:
  group: upm
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # nbgv computes the version from the git height, which needs the full history.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install nbgv
        run: dotnet tool install --global nbgv --version 3.10.94

      - name: Install Unity UPM CLI
        run: bash .github/scripts/install-upm-cli.sh

      - name: Attach Signed Unity Packages
        env:
          GH_TOKEN: ${{ github.token }}
          UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
        run: bash .github/scripts/upm-sync.sh
